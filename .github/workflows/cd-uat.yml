# =====================================================
# Caller Workflow: CD DEV - Azure App Configuration
# =====================================================
# Deploys configuration to the DEV environment.
# Triggers:
# 1. Automatically when CI workflow completes successfully on main branch
# 2. Manual trigger via workflow_dispatch with specified version
#
# Prerequisites:
# - CI workflow must have run and published artifacts
# - Azure OIDC credentials configured for DEV environment
# =====================================================

name: CD - App Configuration (UAT)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Artifact version to deploy (leave empty to use latest from CD)'
        required: false
        type: string
        default: ''
      dry-run:
        description: 'Validate without deploying (dry-run mode)'
        required: false
        type: boolean
        default: false
      force-update:
        description: 'Force update even if version already deployed'
        required: false
        type: boolean
        default: false
      package-registry:
        description: 'Package registry (github or artifactory)'
        required: false
        type: choice
        options:
          - artifactory
          - github
        default: artifactory
  workflow_run:
    workflows: ['CI - App Configuration']
    types: [completed]
    branches: [main]

# Prevent concurrent deployments to DEV
concurrency:
  group: cd-appconfig-uat
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write
  issues: write
  actions: write
  security-events: write

jobs:
  deploy-uat:
    name: Deploy to UAT
    #needs: [validate-ci, resolve-version, approve-uat]
    uses: armedinag/dso-appconfig-reusable/.github/workflows/_cd-appconfig-uat.yml@main
    with:
      environment: uat
      variables-path: .github/variables
      artifact-version: ${{ needs.resolve-version.outputs.version }}
      component-name: dso-appconfig-example
      dry-run: ${{ inputs.dry-run || false }}
      force-update: ${{ inputs.force-update || false }}
      package-registry: ${{ inputs.package-registry || 'artifactory' }}
      artifactory-repository: dso-generic-release-local
      policy-enabled: true
    secrets:
      DSO_WORKFLOWS_GHAPP_ID: ${{ secrets.DSO_WORKFLOWS_GHAPP_ID }}
      DSO_WORKFLOWS_GHAPP_PK: ${{ secrets.DSO_WORKFLOWS_GHAPP_PK }}
      ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}